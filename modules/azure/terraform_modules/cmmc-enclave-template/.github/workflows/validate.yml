name: Validate Modules

on:
  pull_request:
    branches:
      - main
    paths:
      - "modules/**"
      - "examples/**"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "examples/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ github.workspace }}

  validate:
    name: Validate Modules
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/01-entra
          - modules/02-mgmt-vnet
          - modules/03-prod-vnet
          - modules/04-appgate-sdp
          - modules/05-avd
          - modules/06-storage
          - modules/07-vm-imaging
          - modules/08-session-hosts
          - modules/09-intune

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ github.workspace }}/${{ matrix.module }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ github.workspace }}/${{ matrix.module }}

  validate-example:
    name: Validate Example
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ github.workspace }}/examples/customer-repo-example

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ github.workspace }}/examples/customer-repo-example

  comment-on-pr:
    name: Comment Validation Status on PR
    runs-on: ubuntu-latest
    needs: [fmt, validate, validate-example]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fmtResult = '${{ needs.fmt.result }}';
            const validateResult = '${{ needs.validate.result }}';
            const exampleResult = '${{ needs.validate-example.result }}';

            const allPassed = [fmtResult, validateResult, exampleResult].every(r => r === 'success');
            const icon = allPassed ? '✅' : '❌';

            const body = [
              `## ${icon} Terraform Validation Results`,
              '',
              `| Check | Status |`,
              `|-------|--------|`,
              `| Format (\`terraform fmt\`) | ${fmtResult === 'success' ? '✅ Pass' : '❌ Fail'} |`,
              `| Module Validation | ${validateResult === 'success' ? '✅ Pass' : '❌ Fail'} |`,
              `| Example Validation | ${exampleResult === 'success' ? '✅ Pass' : '❌ Fail'} |`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
