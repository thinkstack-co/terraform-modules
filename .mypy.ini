# File:    .mypy.ini
# Purpose: mypy configuration consumed by super-linter (PYTHON_MYPY linter).
# Why:     This repo contains two AWS Lambda handlers, each named the
#          conventional `lambda_function.py`:
#            - modules/aws/aws_cost_report/cost_reporter/lambda_function.py
#            - modules/aws/config/lambda_compliance_reporter/lambda_function.py
#          mypy's default flat-module discovery treats them as a single module
#          and errors out ("Duplicate module named 'lambda_function'").
#          namespace_packages + explicit_package_bases makes mypy infer the
#          package name from the directory path, so the two files become
#          `cost_reporter.lambda_function` and
#          `lambda_compliance_reporter.lambda_function` — distinct modules.
# Why exclude: The Config Lambda vendors its dependencies (PIL, reportlab,
#          chardet) into a `package/` dir. Those are third-party sources we
#          don't own and shouldn't lint.

[mypy]
namespace_packages = True
explicit_package_bases = True
exclude = (?x)(
    /package/
  | /\.venv/
  | /\.terraform/
  | /reports/
  | /lint-reports/
  )

# AWS Lambda runtime modules aren't installed locally; suppress import errors
# rather than treating them as fatal type errors.
ignore_missing_imports = True
