  # ── Additional checks surfaced on the current tree (checkov 3.3.8; not in the
  #    May-2026 baseline). Same consumer-decision / repo-convention rationale. ──
  - CKV_TF_1 # Module sources must use a commit hash — repo pins by version tag (?ref=vX.Y.Z) by convention, not by hash (review candidate)
  - CKV_AWS_88 # EC2 instance should not have public IP — appgate controller legitimately needs one
  - CKV_AWS_130 # VPC subnets must not assign public IP by default — public subnets legitimately do; gated by var.map_public_ip_on_launch
  - CKV_SECRET_6 # Base64 High Entropy String false positive (Intune password policy); gitleaks retains secret coverage
  - CKV2_AWS_45 # Ensure API Gateway V2 has associated authorizer / access logging — consumer decision at the module level
