# Pre-commit hooks for terraform-modules
# Install: brew install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=120]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Ignore vendored Lambda packages and caches to avoid third-party lint noise.
        args:
          [
            --max-line-length=120,
            --extend-ignore=E203,
            "--exclude=package,.venv,.mypy_cache,modules/**/package,modules/**/package/**",
          ]
        # Pre-commit-level exclude for vendored dependencies.
        exclude: ^modules/.*/package/|^modules/.*/lambda_package\\.zip$|^modules/.*/\\.mypy_cache/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        # Treat Terraform module folders as namespace packages and skip vendored deps.
        args:
          [
            --ignore-missing-imports,
            --no-strict-optional,
            --explicit-package-bases,
            --namespace-packages,
            "--exclude=modules/.*/package/|modules/.*/lambda_package\\.zip$|modules/.*/\\.mypy_cache/",
          ]
        # Pre-commit-level exclude for vendored dependencies.
        exclude: ^modules/.*/package/|^modules/.*/lambda_package\\.zip$|^modules/.*/\\.mypy_cache/

  - repo: https://github.com/pycqa/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        # Ignore bundled Lambda dependencies and caches to avoid duplicate-code noise.
        args:
          [
            --max-line-length=120,
            "--disable=C0114,C0115,C0116,E0401",
            "--ignore-paths=^modules/.*/package/|^modules/.*/lambda_package\\.zip$|^modules/.*/\\.mypy_cache/",
          ]

  # Terraform linting - temporarily disabled due to hook issue
  # - repo: https://github.com/terraform-linters/tflint
  #   rev: v0.50.3
  #   hooks:
  #     - id: tflint
  #       args: [--format=compact]

  # Dockerfile linting - temporarily disabled
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.12.0
  #   hooks:
  #     - id: hadolint-docker

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # Duplicate code detection - temporarily disabled
  # - repo: https://github.com/kucherenko/jscpd
  #   rev: v3.5.10
  #   hooks:
  #     - id: jscpd
  #       args: [--min-lines=5, --min-tokens=70]

  # General purpose hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json
      - id: check-merge-conflict
