# File:    .gitleaks.toml
# Purpose: Gitleaks configuration consumed by super-linter (GITLEAKS linter).
#          Inherits the built-in default ruleset and only adds project-specific
#          allowlist entries.
# Why allowlist `var.s3_key_prefix`: the AWS Config module reuses the literal
#          `s3_key_prefix` argument name (an AWS API attribute on the
#          aws_config_delivery_channel resource). Gitleaks' default
#          generic-api-key rule pattern-matches "key" + "prefix" near a
#          quoted string and flags it. The reference is not a secret — it's
#          a Terraform variable name passed through to AWS.

# Inherit gitleaks' default rule set (do not redefine [[rules]] here —
# newer gitleaks rejects rule blocks without a regex or path).
[extend]
useDefault = true

[allowlist]
description = "Global allowlist for false positives"
regexes = [
    # Match any s3_key_prefix variable assignment
    '''s3_key_prefix\s*=\s*var\.s3_key_prefix''',
    '''s3_key_prefix\s*=\s*var\.s3_key_prefix''',
]
paths = [
    # Limit to AWS module directories
    '''modules/aws/.*''',
]

[[allowlist.rules]]
id = "generic-api-key"
description = "Allowlist for s3_key_prefix variable references"
regexTarget = "match"
regex = '''var\.s3_key_prefix'''
